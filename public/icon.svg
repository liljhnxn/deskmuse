<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d4a4" />
      <stop offset="50%" stop-color="#E0A458" />
      <stop offset="100%" stop-color="#b87c2f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="64" height="64" rx="14" fill="#121419" stroke="#262e3b" stroke-width="2" />

  <!-- Monitor Screen Frame -->
  <rect x="12" y="14" width="40" height="26" rx="4" fill="#202630" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Monitor Inner Glow / Display -->
  <rect x="16" y="18" width="32" height="18" rx="2" fill="#181d24" />
  
  <!-- Desk Stand -->
  <path d="M28 40 L28 47 L22 47 L22 50 L42 50 L42 47 L36 47 L36 40 Z" fill="url(#goldGrad)" />
  
  <!-- Screen Accent Graphic / Wave -->
  <path d="M20 28 Q 26 23, 32 27 T 44 24" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Sparkle Accent -->
  <path d="M46 11 L47.5 15 L51.5 16.5 L47.5 18 L46 22 L44.5 18 L40.5 16.5 L44.5 15 Z" fill="#E0A458" filter="url(#glow)" />
</svg>

